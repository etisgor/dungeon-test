<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111914">
  <meta name="description" content="Launch the Dungeon playtest and check the current version.">
  <title>Dungeon Playtest Launcher</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; color: #e8e2d2; background: #111914; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(ellipse at 45% 5%, #334135, #121a15 66%); }
    main { max-width: 570px; width: 100%; padding: clamp(23px, 6vw, 47px); border: 1px solid #536254; border-radius: 8px; background: #1d2720; box-shadow: 0 23px 70px #0006; }
    .mark { display: grid; place-items: center; width: 28px; aspect-ratio: 1; border: 1px solid #bc9b63; color: #e4c891; transform: rotate(45deg); margin: 3px 0 21px 5px; }
    h1 { margin: 0 0 10px; font: 500 clamp(2.25rem, 7vw, 3.8rem)/1 Georgia, serif; }
    p { color: #c3cdbd; line-height: 1.5; margin: 9px 0 16px; }
    .version { font-size: .9rem; color: #d7ba83; font-weight: 650; letter-spacing: .07em; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 24px 0 15px; }
    a, button { border: 1px solid #677963; border-radius: 5px; padding: 9px 12px; font: 600 .9rem system-ui, sans-serif; text-decoration: none; color: #e4e8d9; background: #2e3d31; }
    a:focus-visible, button:focus-visible { outline: 2px solid #edce95; outline-offset: 3px; }
    button { cursor: pointer; }
    a:hover, button:hover { filter: brightness(1.15); }
    .play { color: #1d251b; background: #dcc18a; border-color: #f0d3a1; }
    #status { font-size: .875rem; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true">◆</span>
    <p id="version" class="version">Prototype 0.1.1</p>
    <h1>Dungeon Playtest</h1>
    <p>Open the browser playtest with the ChatGPT account that has access, or get the offline build from the private GitHub release.</p>
    <div class="actions">
      <a class="play" id="play" href="https://dungeon-expedition-prototype.etisgor.chatgpt.site">Play private build</a>
      <a id="download" href="https://github.com/etisgor/Dungeon/releases/tag/v0.1.1">Private GitHub release</a>
      <button type="button" id="check">Check for updates</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
  </main>
  <script>
    const version = document.getElementById('version');
    const status = document.getElementById('status');
    const check = document.getElementById('check');
    const play = document.getElementById('play');
    const download = document.getElementById('download');

    async function update(report) {
      check.disabled = true;
      if (report) status.textContent = 'Checking…';
      try {
        const response = await fetch('./version.json', { cache: 'no-store' });
        if (!response.ok) throw new Error('version unavailable');
        const latest = await response.json();
        const label = 'Prototype ' + latest.version;
        const changed = version.textContent !== label;
        version.textContent = label;
        play.href = latest.play;
        download.href = latest.release;
        if (report) status.textContent = changed ? label + ' is ready to launch.' : 'You have the current launch links.';
      } catch {
        if (report) status.textContent = 'Version check unavailable. You can still use the links above.';
      } finally {
        check.disabled = false;
      }
    }

    check.addEventListener('click', () => update(true));
    update(false);
  </script>
</body>
</html>
